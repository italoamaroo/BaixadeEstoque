# Render Blueprint — Site estático (React + Vite)
# Render > New > Blueprint > selecione este repositório.
services:
  - type: web
    name: baixas-estoque
    runtime: static
    branch: main
    buildCommand: npm ci && npm run check
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Valores públicos do Supabase (Project Settings > API). NÃO use a service_role aqui.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # SPA: qualquer rota interna (/movimentacoes/123, /pendencias-sa...) devolve o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Primeira etapa: observar violações antes de bloquear recursos legítimos.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
